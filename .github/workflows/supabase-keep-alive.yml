name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs 4 times a day (every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC)
    # To run every 3 hours instead, change to: '0 */3 * * *'
    # To run hourly, change to: '0 * * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows triggering manually from the GitHub Actions UI

concurrency:
  group: keep-alive-supabase
  cancel-in-progress: true

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print Timestamp
        run: |
          echo "============================================="
          echo "Triggering Supabase keep-alive ping at $(date -u)"
          echo "============================================="

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Supabase Ping Script
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST || 'https://jmeiegtjrrdeubwzgder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptZWllZ3RqcnJkZXVid3pnZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwNTM3OTgsImV4cCI6MjA3MTYyOTc5OH0.JCuKV4TWJlCs15WePRXhL42ZFZ1Miglb-HcdTt3C0BY' }}
        run: |
          python3 automation/ping_supabase.py

      - name: Direct Fast Curl Verification
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST || 'https://jmeiegtjrrdeubwzgder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptZWllZ3RqcnJkZXVid3pnZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwNTM3OTgsImV4cCI6MjA3MTYyOTc5OH0.JCuKV4TWJlCs15WePRXhL42ZFZ1Miglb-HcdTt3C0BY' }}
        run: |
          echo "Performing raw HTTP PostgREST ping..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Cache-Control: no-cache" \
            "${SUPABASE_HOST}/rest/v1/areas?select=area_id&limit=1")
          
          echo "HTTP Response Status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -eq 200 ] || [ "${HTTP_STATUS}" -eq 206 ]; then
            echo "Successfully pinged Supabase PostgreSQL!"
          else
            echo "Warning: Received HTTP ${HTTP_STATUS}"
            exit 1
          fi
