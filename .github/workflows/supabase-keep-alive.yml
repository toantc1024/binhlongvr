name: Supabase Keep-Alive (Simulated Real User)

on:
  schedule:
    # Option 1: 3 times a day (every 8 hours at 02:00, 10:00, 18:00 UTC) -> 90 runs/month (~360 requests/month)
    # Option 2: 4 times a day (every 6 hours) -> '0 */6 * * *'
    # Option 3: 2 times a day (every 12 hours) -> '0 0,12 * * *'
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

concurrency:
  group: keep-alive-supabase
  cancel-in-progress: true

jobs:
  simulate-user:
    name: Simulate Real User Session
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print Start Info
        run: |
          echo "================================================="
          echo "Starting Binh Long VR simulated user session"
          echo "Timestamp: $(date -u)"
          echo "================================================="

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Realistic User Session
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST || 'https://jmeiegtjrrdeubwzgder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptZWllZ3RqcnJkZXVid3pnZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwNTM3OTgsImV4cCI6MjA3MTYyOTc5OH0.JCuKV4TWJlCs15WePRXhL42ZFZ1Miglb-HcdTt3C0BY' }}
          AREA_ID: 25
        run: |
          python3 automation/ping_supabase.py
